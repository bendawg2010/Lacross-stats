name: Build & Release Windows App

on:
  push:
    tags:
      - 'v*'          # triggers on any tag like v1.0, v1.1, etc.
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find built installer
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and upload .exe
        uses: softprops/action-gh-release@v2
        with:
          name: "Lacrosse Stats ${{ github.ref_name }}"
          body: |
            ## CGLacrossStats — Windows Installer

            ### Install
            1. Download `${{ steps.find_exe.outputs.EXE_NAME }}` below
            2. Run the installer
            3. Launch **Lacrosse Stats** from your Start Menu

            ### Also available
            - `CGLacrossStats.html` — open in any browser, no install needed
          files: ${{ steps.find_exe.outputs.EXE_PATH }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Also attach the standalone HTML to the release
  attach-html:
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload standalone HTML to release
        uses: softprops/action-gh-release@v2
        with:
          files: CGLacrossStats.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
